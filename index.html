<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <h1 class="header-title">My Anime List</h1>
                <div class="view-controls">
                    <button id="gridViewBtn" class="btn btn-outline-secondary active" title="Grid View">
                        <i class="bi bi-grid"></i>
                    </button>
                    <button id="listViewBtn" class="btn btn-outline-secondary" title="List View">
                        <i class="bi bi-list-ul"></i>
                    </button>
                </div>
            </div>
            
            <div class="search-container">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" 
                           class="form-control" 
                           placeholder="Search anime..." 
                           id="searchInput"
                           autocomplete="off">
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <div class="header-actions">
                <button onclick="exportList()" class="btn btn-success">
                    <i class="bi bi-download"></i>
                    <span>Export List</span>
                </button>
                <button onclick="document.getElementById('importFile').click()" class="btn btn-primary">
                    <i class="bi bi-upload"></i>
                    <span>Import List</span>
                </button>
                <button onclick="document.getElementById('malFile').click()" class="btn btn-info text-white">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>Import MAL</span>
                </button>
                <button onclick="removeAllAnime()" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                    <span>Remove All</span>
                </button>
            </div>
        </header>

        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importList(this)">
        <input type="file" id="malFile" accept=".xml" style="display: none;" onchange="importFromMAL(this)">
        
        <div id="animeList" class="grid-view"></div>

        <footer class="footer">
            <span>&copy; VoidBern - </span>
            <a href="https://www.instagram.com/_iqball_03/" target="_blank" rel="noopener">IqbalMVB</a>
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
